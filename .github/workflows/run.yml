name: Run Cita Auto

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Subcommand to run'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - run
          - status
          - verify
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  cita-auto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system packages & python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject configuration & secrets
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          ENV_DIGITALPLAT: ${{ secrets.ENV_DIGITALPLAT }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then
            echo "$CONFIG_JSON" > config.json
          fi
          if [ -n "$ENV_DIGITALPLAT" ]; then
            echo "$ENV_DIGITALPLAT" > .env.digitalplat
          fi

      - name: Execute Cita Auto
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          CMD="${{ github.event.inputs.command }}"
          if [ -z "$CMD" ]; then
            CMD="check"
          fi
          xvfb-run -a python3 cita_auto.py $CMD --once 2>&1 | tee latest_log.txt

          python3 -c "
          import json, datetime
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          data = {
            'updated_at': now,
            'status': 'completed',
            'conclusion': 'success',
            'command': '$CMD',
            'total_applicants': 4,
            'run_url': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          }
          with open('latest_status.json', 'w') as f:
            json.dump(data, f, indent=2)
          "

      - name: Update Live Dashboard on GitHub Pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_log.txt latest_status.json
          git diff --staged --quiet || (git commit -m "Update live dashboard logs [skip ci]" && git push)

      - name: Upload State & Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cita-state
          path: |
            state/
            logs/
          retention-days: 7
